<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>طباعة الباركود — متجر القرطاسية</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.5/JsBarcode.all.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap');
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Cairo',system-ui,sans-serif; background:#f7f8fa; padding:20px; direction:rtl; }
    .no-print { background:#1a1f2e; color:white; padding:14px 24px; display:flex; align-items:center; gap:16px; border-radius:10px; margin-bottom:24px; }
    .no-print h2 { font-size:16px; font-weight:800; flex:1; }
    .btn { padding:9px 18px; border-radius:8px; font-size:14px; font-weight:700; cursor:pointer; border:none; text-decoration:none; display:inline-flex; align-items:center; gap:6px; font-family:inherit; }
    .btn-white { background:white; color:#1a1f2e; }
    .btn-blue  { background:#3b5bdb; color:white; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:16px; }
    .barcode-card { background:white; border:1px solid #e5e7eb; border-radius:10px; padding:16px; text-align:center; page-break-inside:avoid; }
    .barcode-card .product-name { font-size:13px; font-weight:800; color:#1a1f2e; margin-bottom:4px; line-height:1.4; }
    .barcode-card .product-price { font-size:18px; font-weight:800; color:#3b5bdb; margin-bottom:8px; }
    .barcode-card .sku { font-size:10px; color:#6b7280; margin-top:4px; direction:ltr; }
    @media print { .no-print{display:none!important;} body{background:white;padding:10px;} }
  </style>
</head>
<body>
<div class="no-print">
  <h2>🏷️ طباعة الباركود — {{ products|length }} منتج</h2>
  <a href="{% url 'product_list' %}" class="btn btn-white">← العودة للمنتجات</a>
  <button onclick="window.print()" class="btn btn-blue">🖨️ طباعة</button>
</div>
<div class="grid">
  {% for product in products %}
  <div class="barcode-card" id="card-{{ product.pk }}">
    <div class="product-name">{{ product.name }}</div>
    <div class="product-price">{{ product.price }} د.ج</div>
    <svg id="barcode-{{ product.pk }}"></svg>
    <div class="sku">SKU: {{ product.sku }}</div>
  </div>
  {% endfor %}
</div>
<script>
  const products = [{% for product in products %}{ id:{{ product.pk }}, sku:"{{ product.sku }}" },{% endfor %}];
  products.forEach(p => {
    try {
      JsBarcode(`#barcode-${p.id}`, p.sku, { format:"CODE128", width:2, height:50, displayValue:true, fontSize:11, margin:4, lineColor:"#1a1f2e", background:"transparent" });
    } catch(e) {
      document.getElementById(`barcode-${p.id}`).classList.add('error-card');
    }
  });
</script>
</body>
</html>

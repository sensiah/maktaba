{% extends 'core/base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block page_title %}{{ title }}{% endblock %}

{% block content %}
<div class="breadcrumb"><span>{{ title }}</span><span>›</span><a href="{% url 'customer_list' %}">الزبائن</a></div>
<div class="card" style="max-width:600px;">
  <div class="card-header"><div class="card-title">{{ title }}</div></div>
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      <div class="form-grid">
        <div class="form-group"><label class="form-label">الاسم الكامل *</label>{{ form.name }}</div>
        <div class="form-group"><label class="form-label">الهاتف</label>{{ form.phone }}</div>
      </div>
      <div class="form-group"><label class="form-label">البريد الإلكتروني</label>{{ form.email }}</div>
      <div class="form-group"><label class="form-label">العنوان</label>{{ form.address }}</div>
      <div style="display:flex;gap:10px;">
        <button type="submit" class="btn btn-primary">حفظ</button>
        <a href="{% url 'customer_list' %}" class="btn btn-secondary">إلغاء</a>
      </div>
    </form>
  </div>
</div>
<style>input,select,textarea{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;outline:none;font-family:inherit;text-align:right;}input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(59,91,219,0.1);}</style>
{% endblock %}
